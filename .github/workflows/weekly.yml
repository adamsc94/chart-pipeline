name: Weekly chart pipeline

on:
  schedule:
    # Wednesdays at 16:00 UTC (9am Denver). Billboard refreshes charts Tuesday.
    - cron: "0 16 * * 3"
  workflow_dispatch:  # lets me trigger a run by hand from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MB_CONTACT: ${{ secrets.MB_CONTACT }}
        run: python run_pipeline.py